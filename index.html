<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Royal Roi Hotel | 員工服務系統</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --royal-blue: #0A2342;
      --warm-gold: #E8A038;
      --almond-white: #FDF8F0;
      --white: #ffffff;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans TC', "Microsoft JhengHei", sans-serif;
      background: linear-gradient(135deg, var(--royal-blue) 0%, #1a3a5c 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }
    
    .portal-container {
      background: var(--white);
      border-radius: 24px;
      padding: 4rem 3rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
      max-width: 500px;
      width: 100%;
      animation: fadeInUp 0.6s ease-out;
    }
    
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .logo-container {
      margin-bottom: 2rem;
    }
    
    .logo-icon {
      font-size: 5rem;
      color: var(--royal-blue);
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
    
    h1 {
      color: var(--royal-blue);
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }
    
    .subtitle {
      color: #6c757d;
      font-size: 1.1rem;
      margin-bottom: 3rem;
      font-weight: 400;
    }
    
    .enter-button {
      display: inline-block;
      background: linear-gradient(135deg, var(--royal-blue) 0%, #1a3a5c 100%);
      color: var(--white);
      text-decoration: none;
      padding: 1.2rem 3rem;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(10, 35, 66, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .enter-button:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }
    
    .enter-button:hover:before {
      left: 100%;
    }
    
    .enter-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(10, 35, 66, 0.4);
    }
    
    .enter-button:active {
      transform: translateY(-1px);
    }
    
    .enter-button i {
      margin-right: 0.8rem;
      font-size: 1.3rem;
    }
    
    .info-text {
      margin-top: 2rem;
      color: #6c757d;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    
    .divider {
      width: 60px;
      height: 3px;
      background: var(--warm-gold);
      margin: 1.5rem auto;
      border-radius: 2px;
    }
    
    @media (max-width: 600px) {
      .portal-container {
        padding: 3rem 2rem;
      }
      
      h1 {
        font-size: 1.6rem;
      }
      
      .subtitle {
        font-size: 1rem;
      }
      
      .logo-icon {
        font-size: 4rem;
      }
      
      .enter-button {
        padding: 1rem 2.5rem;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>
  <div class="portal-container">
    <div class="logo-container">
      <div class="logo-icon">
        <i class="fa-solid fa-hotel"></i>
      </div>
      <h1>Royal Roi Hotel</h1>
      <div class="divider"></div>
      <p class="subtitle">員工服務系統</p>
    </div>
    
    <a href="https://script.google.com/macros/s/AKfycbwVBzxO68hub4Fk2L2RRT0vAcyijL6rO97aQgXmE1gft_DKj-HMktW5U8PWADSY8vzQjg/exec" class="enter-button">
      <i class="fa-solid fa-right-to-bracket"></i>
      進入系統
    </a>
    
    <div class="info-text">
      <p>請使用您的員工編號和密碼登入</p>
      <p style="margin-top: 0.5rem; font-size: 0.85rem; color: #adb5bd;">
        <i class="fa-solid fa-shield-halved"></i> 安全連線保護
      </p>
    </div>
  </div>
</body>
</html>
